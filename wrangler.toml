name = "step-coach"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# لا تمسح المتغيرات المضافة من لوحة Cloudflare عند كل نشر
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "step-db"
database_id = "28cfa6e1-6c1a-43a2-ba27-b34e78002825"

# حلقة المشي: تخزين الملفات الصوتية (الصوت نفسه يتسجّل في GitHub Actions)
[[kv_namespaces]]
binding = "POD"
id = "3704b7f061c74583b511103b2df2deed"

# جدولة Cloudflare (مجانية): كل ساعة من 3:05 لين 8:05 الفجر بتوقيت السعودية
# تكتب نص الحلقة وتطلب من GitHub يسجّلها فوراً. جدولة GitHub تبقى احتياط.
[triggers]
crons = ["5 0-5 * * *"]

[vars]
MODEL = "claude-sonnet-5-5"            # الدروس وقواعد الحلقة
POD_LISTEN_MODEL = "claude-haiku-5-5"   # جزء الاستماع في الحلقة (أرخص بعشرين مرة)
DAILY_CAP_USD = "1"                     # حد الصرف اليومي على Claude: لو وصله يوقف لين بكرة
