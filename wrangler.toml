name = "step-coach"
main = "src/worker.js"
compatibility_date = "2026-09-01"
# لا تمسح المتغيرات المضافة من لوحة Cloudflare عند كل نشر
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "step-db"
database_id = "28cfa6e1-6c1a-43a2-ba27-b34e78002825"

[vars]
MODEL = "claude-sonnet-5-5"
